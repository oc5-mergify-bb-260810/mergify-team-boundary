pull_request_rules:
  - name: BB P23 MP-check consumer merge
    conditions:
      - title = BB P23 MP check consumer
      - check-success = Mergify Merge Protections
    actions:
      merge:
        method: merge

merge_protections_settings:
  reporting_method: check-runs
  post_comment: true

merge_protections:
  - name: BB P23 base gate
    if:
      - base = main
    success_conditions:
      - base = main

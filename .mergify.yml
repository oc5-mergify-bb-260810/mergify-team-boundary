pull_request_rules:
  - name: BB required team boundary
    conditions:
      - title = BB required team gate canary
    actions:
      merge:
        method: merge

queue_rules:
  - name: default
    batch_size: 2
    batch_max_wait_time: 2 minutes
    queue_conditions: true
    merge_conditions:
      - check-success = BB_QUEUE_EDIT_TRUE_RELEASE_20260816
    allow_queue_branch_edit: true
    merge_method: merge-batch
    checks_timeout: null
